services:
  - type: web
    name: telegram-downloader-bot
    env: python
    plan: free
    buildCommand: |
      apt-get update && apt-get install -y ffmpeg
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: uvicorn main:web_app --host 0.0.0.0 --port 10000
    envVars:
      - key: API_ID
        value: "1234567"
      - key: API_HASH
        value: "YOUR_TELEGRAM_API_HASH_HERE"
      - key: BOT_TOKEN
        value: "YOUR_BOT_TOKEN_HERE"
